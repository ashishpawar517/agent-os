[package]
name = "agent-os"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.6.3", features = [] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
pty = "0.3"
tokio-util = "0.7"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
bytes = "1.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
