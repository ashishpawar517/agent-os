<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent OS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f5f5f5;
        }
        #sidebar {
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        #sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        #new-session-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #new-session-btn:hover {
            background-color: #0051d5;
        }
        #sessions-list {
            flex-grow: 1;
            overflow-y: auto;
        }
        .session-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-item:hover {
            background-color: #f9f9f9;
        }
        .session-item.active {
            background-color: #e3f2fd;
            border-left: 3px solid #007aff;
        }
        .session-info {
            flex-grow: 1;
        }
        .session-user {
            font-weight: 500;
            color: #333;
        }
        .session-tabs {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .session-tab {
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .session-tab.active {
            background-color: #e3f2fd;
            border-color: #007aff;
            color: #007aff;
        }
        .session-tab.close-btn {
            background-color: #ffebee;
            color: #f44336;
            font-weight: bold;
            padding: 2px 6px;
        }
        .session-tab.close-btn:hover {
            background-color: #ffcdd2;
        }
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #ffffff;
        }
        #main-header {
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        #main-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        #main-controls {
            display: flex;
            gap: 12px;
        }
        .main-control-btn {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .main-control-btn:hover {
            background-color: #e0e0e0;
        }
        #tab-container {
            flex-grow: 1;
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            overflow-x: auto;
        }
        .tab {
            padding: 12px 16px;
            border-right: 1px solid #e0e0e0;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: #f8f9fa;
            color: #666;
        }
        .tab.active {
            background-color: #ffffff;
            color: #333;
            font-weight: 500;
            border-bottom: 2px solid #007aff;
        }
        .tab-close-btn {
            margin-left: 8px;
            font-size: 14px;
            color: #999;
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .tab-close-btn:hover {
            background-color: #f0f0f0;
            color: #f44336;
        }
        #content-area {
            flex-grow: 1;
            overflow: hidden;
            background-color: #ffffff;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            border: none;
        }
        #no-session-message {
            padding: 40px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <div id="sidebar-title">Agent OS Sessions</div>
            <button id="new-session-btn">New Session</button>
        </div>
        <div id="sessions-list">
            <!-- Session items will be dynamically inserted here -->
        </div>
    </div>
    <div id="main-content">
        <div id="main-header">
            <div id="main-title">Agent OS</div>
            <div id="main-controls">
                <button id="refresh-btn">Refresh</button>
                <button id="cleanup-btn">Cleanup Expired</button>
            </div>
        </div>
        <div id="tab-container">
            <!-- Tabs will be dynamically inserted here -->
        </div>
        <div id="content-area">
            <div id="terminal-container"></div>
            <div id="no-session-message">
                <p>Select a session to begin working</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { Terminal } from 'https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js';
        import { Addon } from 'https://cdn.jsdelivr.net/npm/xterm-addon-web-links/lib/xterm-addon-web-links.js';

        let currentSessionId = null;
        let currentTabId = null;
        let terminal = null;
        let ws = null;

        // Initialize terminal
        const terminalContainer = document.getElementById('terminal-container');
        terminal = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            theme: {
                background: '#000000',
                foreground: '#ffffff',
            }
        });

        terminal.open(terminalContainer);

        // Add web links addon
        const webLinksAddon = new Addon();
        terminal.loadAddon(webLinksAddon);

        // DOM elements
        const sessionsList = document.getElementById('sessions-list');
        const tabContainer = document.getElementById('tab-container');
        const mainTitle = document.getElementById('main-title');
        const noSessionMessage = document.getElementById('no-session-message');
        const newSessionBtn = document.getElementById('new-session-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const cleanupBtn = document.getElementById('cleanup-btn');

        // Terminal WebSocket connection
        function connectTerminal() {
            // Close existing connection if any
            if (ws) {
                ws.close();
            }

            // Connect to WebSocket
            ws = new WebSocket(`ws://${location.host}/ws/terminal`);

            ws.onopen = () => {
                terminal.write('\r\n[Connected to terminal]\r\n');
            };

            ws.onmessage = (event) => {
                const data = typeof event.data === 'string' ? event.data : new TextDecoder().decode(event.data);
                terminal.write(data);
            };

            ws.onclose = () => {
                terminal.write('\r\n[Disconnected from terminal]\r\n');
                // Try to reconnect after a short delay
                if (currentSessionId && currentTabId) {
                    setTimeout(connectTerminal, 1000);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                terminal.write('\r\n[WebSocket error]\r\n');
            };
        }

        // Handle terminal input
        terminal.onData((data) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });

        // API functions
        async function apiCall(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                },
            };

            if (data !== null) {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(`/api/${endpoint}`, options);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('API call failed:', error);
                throw error;
            }
        }

        // UI update functions
        async function loadSessions() {
            try {
                const sessions = await apiCall('session/list_sessions');
                sessionsList.innerHTML = '';

                if (sessions.length === 0) {
                    sessionsList.innerHTML = '<div style="padding: 16px; color: #666;">No sessions available</div>';
                    return;
                }

                sessions.forEach(sessionId => {
                    const sessionItem = document.createElement('div');
                    sessionItem.className = `session-item ${sessionId === currentSessionId ? 'active' : ''}`;
                    sessionItem.dataset.sessionId = sessionId;
                    sessionItem.innerHTML = `
                        <div class="session-info">
                            <div class="session-user">${sessionId}</div>
                            <div class="session-tabs" id="tabs-${sessionId}"></div>
                        </div>
                        <div>
                            <button class="session-tab close-btn" onclick="closeSession('${sessionId}')">×</button>
                        </div>
                    `;
                    sessionsList.appendChild(sessionItem);

                    // Load tabs for this session
                    loadSessionTabs(sessionId);
                });
            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        async function loadSessionTabs(sessionId) {
            try {
                const tabs = await apiCall(`session/list_session_tabs?session_id=${sessionId}`);
                const tabsContainer = document.getElementById(`tabs-${sessionId}`);

                if (tabsContainer) {
                    tabsContainer.innerHTML = '';
                    tabs.forEach(tabId => {
                        const tabElement = document.createElement('span');
                        tabElement.className = `session-tab ${tabId === currentTabId && sessionId === currentSessionId ? 'active' : ''}`;
                        tabElement.dataset.tabId = tabId;
                        tabElement.dataset.sessionId = sessionId;
                        tabElement.textContent = tabId.length > 10 ? tabId.substring(0, 10) + '...' : tabId;
                        tabElement.onclick = () => switchToTab(sessionId, tabId);
                        tabsContainer.appendChild(tabElement);
                    });
                }
            } catch (error) {
                console.error('Failed to load session tabs:', error);
            }
        }

        async function loadTabContent(tabId) {
            try {
                const tab = await apiCall(`session/get_tab?tab_id=${tabId}`);
                if (tab) {
                    // Update UI to show this tab is active
                    document.querySelectorAll('.tab').forEach(tabEl => {
                        tabEl.classList.remove('active');
                    });

                    const activeTabEl = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
                    if (activeTabEl) {
                        activeTabEl.classList.add('active');
                    }

                    // Update main title
                    mainTitle.textContent = `Agent OS - ${tab.title || 'Untitled'}`

                    // Handle different component types
                    switch (tab.component_type) {
                        case 'terminal':
                            showTerminal(tab);
                            break;
                        case 'browser':
                            showBrowser(tab);
                            break;
                        default:
                            showDefault(tab);
                    }

                    currentTabId = tabId;
                }
            } catch (error) {
                console.error('Failed to load tab content:', error);
            }
        }

        function showTerminal(tab) {
            noSessionMessage.style.display = 'none';
            terminalContainer.style.display = 'block';

            // Reconnect terminal if needed
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
            connectTerminal();
        }

        function showBrowser(tab) {
            noSessionMessage.style.display = 'none';
            terminalContainer.style.display = 'none';
            // In a real implementation, we would show a browser view here
            terminalContainer.innerHTML = `
                <div style="padding: 40px; text-align: center;">
                    <h3>Browser Component</h3>
                    <p>URL: ${tab.component_state?.url || 'Not available'}</p>
                    <p>This is a placeholder for the browser component.</p>
                </div>
            `;
        }

        function showDefault(tab) {
            noSessionMessage.style.display = 'none';
            terminalContainer.style.display = 'block';
            terminalContainer.innerHTML = `
                <div style="padding: 40px; text-align: center;">
                    <h3>${tab.component_type || 'Unknown Component'}</h3>
                    <p>This component type is not yet implemented in the UI.</p>
                </div>
            `;
        }

        function showNoSessionMessage() {
            noSessionMessage.style.display = 'block';
            terminalContainer.style.display = 'none';
            terminal.clear();
        }

        // Event handlers
        newSessionBtn.addEventListener('click', async () => {
            try {
                const result = await apiCall('session/create_session', 'POST', { user_id: 'user_' + Date.now() });
                if (result) {
                    loadSessions();
                    // Switch to the new session
                    const sessionItems = sessionsList.querySelectorAll('.session-item');
                    sessionItems.forEach(item => {
                        if (item.dataset.sessionId === result) {
                            item.click();
                        }
                    });
                }
            } catch (error) {
                console.error('Failed to create session:', error);
            }
        });

        refreshBtn.addEventListener('click', () => {
            loadSessions();
        });

        cleanupBtn.addEventListener('click', async () => {
            try {
                const count = await apiCall('session/cleanup_expired_sessions');
                alert(`Cleaned up ${count} expired sessions`);
                loadSessions();
            } catch (error) {
                console.error('Failed to cleanup sessions:', error);
            }
        });

        // Session item click handler
        sessionsList.addEventListener('click', (e) => {
            const sessionItem = e.target.closest('.session-item');
            if (sessionItem && sessionItem.dataset.sessionId) {
                // Update active session styling
                document.querySelectorAll('.session-item').forEach(item => {
                    item.classList.remove('active');
                });
                sessionItem.classList.add('active');

                currentSessionId = sessionItem.dataset.sessionId;
                mainTitle.textContent = `Agent OS - Session ${currentSessionId}`;

                // Load tabs for this session
                loadSessionTabs(currentSessionId);

                // If there's an active tab, show it
                if (currentTabId) {
                    loadTabContent(currentTabId);
                } else {
                    showNoSessionMessage();
                }
            }
        });

        // Tab click handler
        function switchToTab(sessionId, tabId) {
            currentSessionId = sessionId;
            currentTabId = tabId;

            // Update tab styling
            document.querySelectorAll('.tab').forEach(tabEl => {
                tabEl.classList.remove('active');
            });

            const tabEl = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
            if (tabEl) {
                tabEl.classList.add('active');
            }

            // Update main title
            mainTitle.textContent = `Agent OS - Tab ${tabId}`;

            // Load tab content
            loadTabContent(tabId);
        }

        async function closeSession(sessionId) {
            if (confirm(`Are you sure you want to delete session ${sessionId}?`)) {
                try {
                    await apiCall(`session/destroy_session`, 'POST', { session_id: sessionId });
                    loadSessions();

                    // If we closed the current session, clear UI
                    if (sessionId === currentSessionId) {
                        currentSessionId = null;
                        currentTabId = null;
                        mainTitle.textContent = 'Agent OS';
                        showNoSessionMessage();
                    }
                } catch (error) {
                    console.error('Failed to close session:', error);
                }
            }
        }

        // Initialize UI
        async function init() {
            loadSessions();

            // Set up terminal container resize observer
            const resizeObserver = new ResizeObserver(() => {
                terminal.fit();
            });
            resizeObserver.observe(terminalContainer);
        }

        // Start the application
        init();
    </script>
</body>
</html>
